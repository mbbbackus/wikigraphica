<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wikigraphica</title>
    <style>
      :root {
        --bg: #faf9f6;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #2b6cb0;
        --accent-soft: #ebf2fa;
        --border: #e2e2e2;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }
      header h1 {
        font-size: 32px;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 0 0 24px;
        color: var(--muted);
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        font-family: inherit;
      }
      input[type="text"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }
      button {
        padding: 12px 18px;
        font-size: 15px;
        font-weight: 500;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
      }
      button.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
        padding: 8px 14px;
        font-size: 14px;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .status {
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
      }
      .status.error { color: #c53030; }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 32px 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card.fresh { box-shadow: 0 0 0 2px var(--accent); }
      .card .img-wrap {
        aspect-ratio: 2 / 3;
        background: #f0eee9;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card .meta {
        padding: 10px 12px 12px;
      }
      .card .title {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .sub {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card a {
        color: inherit;
        text-decoration: none;
      }
      .pending {
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        text-align: center;
        padding: 8px 12px;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e0;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 12px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Wikigraphica</h1>
        <p class="tagline">Paste a Wikipedia URL or search keywords.</p>
      </header>

      <form id="form">
        <input
          id="q"
          type="text"
          required
          placeholder="https://en.wikipedia.org/wiki/Octopus  —  or  —  octopus"
          autocomplete="off"
          autofocus
        />
        <button id="submit" type="submit">Go</button>
      </form>
      <div class="row">
        <button id="gallery-btn" class="ghost" type="button">View gallery</button>
        <span id="status" class="status"></span>
      </div>

      <section id="results-section" hidden>
        <div class="section-title" id="results-label">Results</div>
        <div id="results" class="grid"></div>
      </section>

      <section id="gallery-section" hidden>
        <div class="section-title">Recent infographics</div>
        <div id="gallery" class="grid"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("form");
      const qInput = document.getElementById("q");
      const submitBtn = document.getElementById("submit");
      const statusEl = document.getElementById("status");
      const galleryBtn = document.getElementById("gallery-btn");
      const resultsSection = document.getElementById("results-section");
      const resultsLabel = document.getElementById("results-label");
      const resultsEl = document.getElementById("results");
      const gallerySection = document.getElementById("gallery-section");
      const galleryEl = document.getElementById("gallery");

      function isWikiUrl(s) {
        try {
          const u = new URL(s);
          return /(^|\.)wikipedia\.org$/.test(u.hostname) && /^\/wiki\/.+/.test(u.pathname);
        } catch {
          return false;
        }
      }

      function cardHtml(row, opts = {}) {
        const fresh = opts.fresh ? " fresh" : "";
        const date = new Date(row.created_at).toLocaleString();
        const imgSrc = row.image_url || "";
        const wikiHref = row.wiki_url;
        return `
          <div class="card${fresh}" data-id="${row.id}">
            <a class="img-wrap" href="${imgSrc}" target="_blank" rel="noopener">
              <img src="${imgSrc}" alt="${row.wiki_title}" />
            </a>
            <div class="meta">
              <div class="title"><a href="${wikiHref}" target="_blank" rel="noopener">${row.wiki_title}</a></div>
              <div class="sub">${date}</div>
            </div>
          </div>
        `;
      }

      function pendingCardHtml() {
        return `
          <div class="card" id="pending-card">
            <div class="img-wrap">
              <div class="pending"><span class="spinner"></span>Generating new infographic…</div>
            </div>
            <div class="meta">
              <div class="title">New generation</div>
              <div class="sub">~15–30s</div>
            </div>
          </div>
        `;
      }

      function renderResults(rows, { withPending = false } = {}) {
        resultsSection.hidden = false;
        const cards = rows.map((r, i) => cardHtml(r, { fresh: i === 0 && withPending === false ? false : false }));
        resultsEl.innerHTML = (withPending ? pendingCardHtml() : "") + cards.join("");
      }

      function setStatus(text, isError = false) {
        statusEl.className = "status" + (isError ? " error" : "");
        statusEl.innerHTML = text;
      }

      async function loadGallery() {
        gallerySection.hidden = false;
        galleryEl.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const res = await fetch("/gallery");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "failed");
          if (!data.results.length) {
            galleryEl.innerHTML = '<div class="empty">No infographics yet. Generate one above.</div>';
            return;
          }
          galleryEl.innerHTML = data.results.map((r) => cardHtml(r)).join("");
        } catch (err) {
          galleryEl.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
        }
      }

      galleryBtn.addEventListener("click", () => {
        if (gallerySection.hidden) {
          galleryBtn.textContent = "Hide gallery";
          loadGallery();
        } else {
          gallerySection.hidden = true;
          galleryBtn.textContent = "View gallery";
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const q = qInput.value.trim();
        if (!q) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Working…";
        setStatus("");
        resultsEl.innerHTML = "";
        resultsSection.hidden = true;

        try {
          if (isWikiUrl(q)) {
            resultsLabel.textContent = "Cached + generating…";
            const cachedPromise = fetch("/by-url?url=" + encodeURIComponent(q))
              .then((r) => r.json())
              .catch(() => ({ results: [] }));
            const generatingPromise = fetch("/generate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url: q }),
            }).then(async (r) => {
              const d = await r.json();
              if (!r.ok) throw new Error(d.error || "generate failed");
              return d;
            });

            const cached = await cachedPromise;
            renderResults(cached.results || [], { withPending: true });
            setStatus(
              cached.results?.length
                ? `Showing ${cached.results.length} cached. New one generating in background.`
                : "No cached versions. Generating fresh — ~15–30s.",
            );

            try {
              const fresh = await generatingPromise;
              const pending = document.getElementById("pending-card");
              if (pending) pending.remove();
              resultsEl.insertAdjacentHTML("afterbegin", cardHtml(fresh, { fresh: true }));
              resultsLabel.textContent = "Results";
              setStatus("Done.");
            } catch (err) {
              const pending = document.getElementById("pending-card");
              if (pending) pending.remove();
              setStatus("Generation failed: " + err.message, true);
            }
          } else {
            resultsLabel.textContent = `Search results for "${q}"`;
            const res = await fetch("/search?q=" + encodeURIComponent(q));
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "search failed");
            renderResults(data.results || []);
            setStatus(
              data.results?.length
                ? `${data.results.length} match${data.results.length === 1 ? "" : "es"}.`
                : "No matches. Paste a Wikipedia URL to generate one.",
            );
          }
        } catch (err) {
          setStatus("Error: " + err.message, true);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Go";
        }
      });
    </script>
  </body>
</html>
